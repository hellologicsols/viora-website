<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viora</title>
<meta name="description" content="Viora is an AI health coach for iPhone. Myra is your dietitian, coach and health buddy in one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
:root { --ground:#F7F5FD; --ink:#1D1830; --muted:#5E5774; --violet:#5B40C9; --tint:#F0ECFE; --font:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --ground:#13111B; --ink:#F1EEFA; --muted:#A8A1BF; --violet:#B8A8FF; --tint:#2A2342; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font:17px/1.6 var(--font); padding-inline:16px; }
main { max-width:560px; margin:0 auto; padding-block:12vh 48px; display:grid; gap:16px; justify-items:start; }
.orb { width:88px; height:88px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#FBF9FF 0%,#CDBFFD 45%,#8B6FF0 100%); box-shadow:0 0 0 8px var(--tint); }
h1 { font-size:40px; line-height:1.1; margin:12px 0 0; letter-spacing:-0.02em; }
p { margin:0; color:var(--muted); max-width:46ch; }
nav { display:flex; gap:20px; flex-wrap:wrap; margin-top:8px; }
a { color:var(--violet); font-weight:600; }
footer { color:var(--muted); font-size:13px; margin-top:32px; }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>Viora</h1>
  <p>Healthy, made simple. Myra is your dietitian, your coach and your health buddy in one iPhone app.</p>
  <nav><a href="privacy.html">Privacy policy</a><a href="mailto:hello@logicsols.com">Contact: hello@logicsols.com</a></nav>
  <footer>© 2026 Logistics Technology Solutions L.L.C.</footer>
</main>
</body>
</html>
